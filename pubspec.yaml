name: finanzapp
description: MVP de gestion de gastos personales con Flutter y Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  sqflite: ^2.4.1
  path: ^1.9.0
  image_picker: ^1.1.2
  fl_chart: ^0.70.2
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
